; ESP32-S3 (N16R8 / N8R2 공용). PSRAM 은 쓰지 않는다.
; usb_speaker.cpp 의 우회 코드가 Arduino 코어 2.0.x 의 USB 드라이버에 맞춰져 있어 플랫폼 버전을 고정한다.
[env:esp32s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
